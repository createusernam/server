services:
  spacebar-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spacebar-server
    restart: unless-stopped
    network_mode: "host"  # Используем сеть хоста для подключения к PostgreSQL
    # ports:  # Не нужны с network_mode: "host"
    #   - "3001:3001"
    #   - "3004:3004"  # WebRTC voice server
    volumes:
      - ./config.json:/spacebar/config.json:ro
      # database.db volume удален - используется PostgreSQL
      - ./files:/spacebar/files
    env_file:
      - .env  # DATABASE и другие секреты (не коммитится в git)
    environment:
      - PORT=3001
      - CONFIG_PATH=/spacebar/config.json
      - CONFIG_READONLY=true
      - WRTC_LIBRARY=@spacebarchat/medooze-webrtc
      - WRTC_WS_PORT=3004
      # WRTC_PUBLIC_IP должен быть установлен через .env файл (не коммитится в git)
      # Пример: WRTC_PUBLIC_IP=storytable.ru или WRTC_PUBLIC_IP=<PUBLIC_IP>
      # DATABASE должен быть установлен через переменную окружения при деплое
      # Для PostgreSQL: postgres://user:password@host:port/database
      # Для SQLite (не рекомендуется):  /spacebar/database.db
      # ВАЖНО: С network_mode: "host" используйте localhost для подключения к PostgreSQL
      # Пример: - DATABASE=postgres://spacebar:password@localhost:5432/spacebar
