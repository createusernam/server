services:
  spacebar-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spacebar-server
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "3004:3004"  # WebRTC voice server
    volumes:
      - ./config.json:/spacebar/config.json:ro
      # database.db volume удален - используется PostgreSQL
      - ./files:/spacebar/files
    environment:
      - PORT=3001
      - CONFIG_PATH=/spacebar/config.json
      - CONFIG_READONLY=true
      - WRTC_LIBRARY=@spacebarchat/medooze-webrtc
      - WRTC_WS_PORT=3004
      # DATABASE должен быть установлен через переменную окружения при деплое
      # Для PostgreSQL: postgres://user:password@host:port/database
      # Для SQLite (не рекомендуется):  /spacebar/database.db
      # Пример: - DATABASE=postgres://spacebar:password@172.17.0.1:5432/spacebar
