# Nginx конфигурация для Spacebar Server на VPS
# ВАЖНО: Замените <VPS_DOMAIN> на ваш домен перед использованием!

# Редирект с HTTP на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name <VPS_DOMAIN> www.<VPS_DOMAIN>;
    
    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}

# Основной сервер (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <VPS_DOMAIN> www.<VPS_DOMAIN>;

    # SSL сертификаты (настраиваются через Let's Encrypt)
    # После получения сертификата раскомментируйте и замените <VPS_DOMAIN>:
    # ssl_certificate /etc/letsencrypt/live/<VPS_DOMAIN>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<VPS_DOMAIN>/privkey.pem;
    
    # Временно без SSL (для начальной настройки)
    # После получения сертификатов раскомментируйте строки выше

    # Логи (замените <VPS_DOMAIN> на ваш домен)
    access_log /var/log/nginx/<VPS_DOMAIN>-access.log;
    error_log /var/log/nginx/<VPS_DOMAIN>-error.log;

    # Проксирование на Spacebar Server
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # WebSocket поддержка
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Кэширование
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Last-Modified $date_gmt;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    }

    # WebRTC Voice Server проксирование
    location /webrtc {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты для WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Статические файлы (если нужно, замените <VPS_DOMAIN> на ваш домен)
    location /static/ {
        alias /var/www/<VPS_DOMAIN>/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

